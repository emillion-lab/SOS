name = "sos"
main = "src/worker.js"
compatibility_date = "2026-09-01"
account_id = "74820d71c551391ce31d309c2fcb091c"
workers_dev = true

# Един Durable Object държи всички WebSocket връзки (хибернация — плаща се само при съобщение).
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Админ ключът е Worker secret SOS_ADMIN_TOKEN — слага се от mvr-worker → sos-admin-token.yml.
# Качва се от mvr-worker/.github/workflows/deploy-sos.yml — там е CLOUDFLARE_API_TOKEN.
