name = "sos"
main = "src/worker.js"
compatibility_date = "2026-09-01"
account_id = "74820d71c551391ce31d309c2fcb091c"
workers_dev = true

# Един Durable Object държи всички WebSocket връзки (хибернация — плаща се само при съобщение).
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Само за четене на admin:token — същият админ токен като на fish.taxi (ротира се от /admin/rotate-token на mvr-proxy).
[[kv_namespaces]]
binding = "GPS_STORE"
id = "2900a1d9de0f49deac2359e558ba5783"

# Качва се от mvr-worker/.github/workflows/deploy-sos.yml — там е CLOUDFLARE_API_TOKEN.
