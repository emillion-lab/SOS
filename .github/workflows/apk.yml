name: Build APK
# Само ръчно, докато мине зелено — после се връща push тригер за android/**.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SOS.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest SOS.apk --title "SOS #${{ github.run_number }}" --notes "Свали SOS.apk на телефона и го инсталирай."
      - name: Save log on failure
        if: failure()
        run: |
          git config user.name sos-bot
          git config user.email sos-bot@users.noreply.github.com
          grep -nE "^e: |error:|FAILURE|What went wrong" -A3 build.log > last-build.log || true
          tail -c 40000 build.log >> last-build.log
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git add -f last-build.log
          git commit -m "build log #${{ github.run_number }}"
          git push -f origin ci-logs
