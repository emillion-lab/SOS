name: Build APK (проверка)
# Тук само се проверява, че кодът се компилира. Подписаното APK за хората се строи в
# emillion-lab/mvr-worker → sos-apk.yml (там е ключът за подписване) и се сваля от
# https://sos.mihov-emil.workers.dev/SOS.apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.repository_owner == 'emillion-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Remove the old unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk-latest -y --cleanup-tag || true
      - name: Save log
        if: always()
        run: |
          git config user.name sos-bot
          git config user.email sos-bot@users.noreply.github.com
          { echo "run #${{ github.run_number }} · ${{ job.status }} · $(git rev-parse --short HEAD)"; grep -nE "^e: |error:|FAILURE|What went wrong|BUILD SUCCESSFUL" -A3 build.log | head -150; echo; tail -c 20000 build.log; } > last-build.log || true
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git add -f last-build.log
          git commit -m "build log #${{ github.run_number }} [skip ci]"
          git push -f origin ci-logs
